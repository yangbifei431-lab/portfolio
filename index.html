<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杨璧霏-个人作品集</title>
    <style>
        /* 清除所有边距，让 PDF 最大化 */
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: -apple-system, sans-serif; }
        
        /* 顶部极简导航条 */
        .nav { height: 45px; background: #333; display: flex; justify-content: center; align-items: center; gap: 15px; padding: 0 10px; }
        .nav a { color: #ccc; text-decoration: none; font-size: 14px; cursor: pointer; transition: 0.2s; white-space: nowrap; padding: 5px; }
        .nav a:hover { color: #fff; }
        .nav a.active { color: #fff; font-weight: bold; border-bottom: 2px solid #fff; }

        /* PDF 全屏容器 */
        .pdf-container { width: 100%; height: calc(100% - 45px); }
        iframe { width: 100%; height: 100%; border: none; display: none; background: #525659; }
        iframe.active { display: block; }

        /* 手机端的专属提示界面 */
        .mobile-tip { display: none; text-align: center; padding: 50px 20px; color: #666; }
        .mobile-tip h2 { font-size: 18px; color: #333; margin-bottom: 10px; }
        .mobile-tip p { font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>

    <!-- 极简导航 -->
    <div class="nav">
        <a id="tab0" class="active" onclick="showPdf(0)">杨璧霏-简历</a>
        <a id="tab1" onclick="showPdf(1)">作品集1：马应龙尽调</a>
        <a id="tab2" onclick="showPdf(2)">作品集2：储能研究</a>
    </div>

    <!-- 电脑端：全屏 PDF 阅读区 -->
    <div class="pdf-container" id="pc-view">
        <iframe id="pdf0" src="resume.pdf" class="active"></iframe>
        <iframe id="pdf1" src="work1.pdf"></iframe>
        <iframe id="pdf2" src="work2.pdf"></iframe>
    </div>

    <!-- 手机端：提示区（不加载iframe，防止乱码） -->
    <div class="mobile-tip" id="mobile-view">
        <h2>请在手机上直接查看</h2>
        <p>点击上方导航栏按钮，系统会自动调起手机阅读器，<br>支持双指缩放和丝滑阅读。</p>
    </div>

    <script>
        // 判断是否为手机设备
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // 如果是手机，直接隐藏电脑端的 iframe，显示提示
        if (isMobile) {
            document.getElementById('pc-view').style.display = 'none';
            document.getElementById('mobile-view').style.display = 'block';
        }

        function showPdf(num) {
            let fileName = "";
            if (num === 0) fileName = "resume.pdf";
            if (num === 1) fileName = "work1.pdf";
            if (num === 2) fileName = "work2.pdf";

            // 【核心逻辑】如果识别到是手机，直接在外部新窗口打开 PDF 原件，调用手机原生阅读器
            if (isMobile) {
                window.open(fileName, "_blank");
                return; // 结束执行，不执行下面的切换逻辑
            }

            // 电脑端的切换逻辑（保持不变）
            document.getElementById('pdf0').classList.remove('active');
            document.getElementById('pdf1').classList.remove('active');
            document.getElementById('pdf2').classList.remove('active');
            document.getElementById('tab0').classList.remove('active');
            document.getElementById('tab1').classList.remove('active');
            document.getElementById('tab2').classList.remove('active');

            if (num === 0) {
                document.getElementById('pdf0').classList.add('active');
                document.getElementById('tab0').classList.add('active');
            } else if (num === 1) {
                document.getElementById('pdf1').classList.add('active');
                document.getElementById('tab1').classList.add('active');
            } else {
                document.getElementById('pdf2').classList.add('active');
                document.getElementById('tab2').classList.add('active');
            }
        }
    </script>
</body>
</html>
